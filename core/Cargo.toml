[package]
name = "blossom"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["raw_value"] }
tokio = { version = "1.54.1", features = ["rt", "time"] }
ts-rs = "12.0.1"

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "sync", "time"] }
wiremock = "0.6.5"
