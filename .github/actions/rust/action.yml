name: rust
description: Install the pinned Rust toolchain as the only one on the runner, and restore the Rust cache.

inputs:
  toolchain:
    description: The pinned toolchain version.
    required: true
  components:
    description: The toolchain components to install, separated by commas. None by default.
    required: false
    default: ""

outputs:
  cache-hit:
    description: Whether the Rust cache was restored with a full match.
    value: ${{ steps.cache.outputs.cache-hit }}

runs:
  using: composite
  steps:
    - name: install the pinned toolchain and remove every other one
      shell: bash
      env:
        PINNED_TOOLCHAIN: ${{ inputs.toolchain }}
        COMPONENTS: ${{ inputs.components }}
      run: |
        if [ -n "$COMPONENTS" ]; then
          rustup toolchain install "$PINNED_TOOLCHAIN" --profile minimal --component "$COMPONENTS" --no-self-update
        else
          rustup toolchain install "$PINNED_TOOLCHAIN" --profile minimal --no-self-update
        fi
        rustup default "$PINNED_TOOLCHAIN"
        for installed_toolchain in $(rustup toolchain list --quiet); do
          case "$installed_toolchain" in
            "$PINNED_TOOLCHAIN"-*) ;;
            *) rustup toolchain uninstall "$installed_toolchain" ;;
          esac
        done
        rustup toolchain list
    - id: cache
      uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
      with:
        save-if: ${{ github.ref == 'refs/heads/main' }}
