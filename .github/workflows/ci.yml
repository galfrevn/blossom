name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  RUST_TOOLCHAIN: 1.100.0
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: conventions, core and ui
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: $/.github/actions/rust
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt,clippy
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f
        with:
          tool: zizmor@1.32.0,cargo-deny@0.22.0
      - run: zizmor .github
        env:
          GH_TOKEN: ${{ github.token }}
      - run: cargo deny --locked check
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: cargo run --quiet --package conventions
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --exclude desktop --all-targets --quiet -- --deny warnings
      - run: cargo test --workspace --exclude desktop --quiet
      - run: ./node_modules/.bin/biome check
      - run: bun run --cwd ui types
      - run: bun run --cwd ui test
      - run: bun run --cwd ui build
      - run: sh budgets.sh javascript

  desktop:
    name: desktop
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: $/.github/actions/rust
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
      - run: cargo clippy --package desktop --all-targets --quiet -- --deny warnings

  installer:
    name: installer
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: $/.github/actions/rust
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: sh budgets.sh installer
