name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  linux:
    name: conventions, core and ui
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.100.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: cargo run --quiet --package conventions
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --exclude desktop --all-targets --quiet -- --deny warnings
      - run: cargo test --workspace --exclude desktop --quiet
      - run: ./node_modules/.bin/biome check
      - run: bun run --cwd ui types
      - run: bun run --cwd ui test
      - run: bun run --cwd ui build
      - run: sh budgets.sh javascript

  macos:
    name: desktop
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.100.0
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: cargo clippy --package desktop --all-targets --quiet -- --deny warnings
      - run: bun run build
      - run: sh budgets.sh installer
